name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test-build:
    name: Test and build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Tests
        run: swift test --disable-sandbox --scratch-path /tmp/umamibar-tests -Xswiftc -module-cache-path -Xswiftc /tmp/umamibar-module-cache
      - name: Build universal app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh
      - name: Package and verify
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/python" -m pip install -r scripts/requirements-dmg.txt
          DMG_PYTHON="$RUNNER_TEMP/dmg-tools/bin/python" ./scripts/package-release.sh
      - name: Validate release tooling
        run: python3 -m unittest discover -s tests-release -v
      - name: Upload installable package
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UmamiBar-${{ matrix.runner }}
          path: |
            dist/UmamiBar-*-universal.zip
            dist/UmamiBar-*-universal.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Package download summary
        env:
          ARTIFACT_URL: ${{ steps.package.outputs.artifact-url }}
          RUNNER_NAME: ${{ matrix.runner }}
        run: |
          {
            echo "### UmamiBar universal package ($RUNNER_NAME)"
            echo
            echo "[Download package artifact]($ARTIFACT_URL) (retained for 14 days; GitHub sign-in required)."
            echo
            echo 'Extract the artifact, open the DMG, and drag UmamiBar.app to Applications. A ZIP is also included.'
            echo 'The app supports Intel and Apple Silicon. It is ad-hoc signed and not notarized.'
            echo
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
