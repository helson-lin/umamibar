name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test-build:
    name: Test and build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Tests
        run: swift test --disable-sandbox --scratch-path /tmp/umamibar-tests -Xswiftc -module-cache-path -Xswiftc /tmp/umamibar-module-cache
      - name: Build universal app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh
      - name: Package and verify
        run: ./scripts/package-release.sh
      - name: Validate release tooling
        run: python3 -m unittest discover -s tests-release -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UmamiBar-${{ matrix.runner }}
          path: |
            dist/UmamiBar-*-universal.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
