name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require stable tag matching VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Use vX.Y.Z stable tags'
          assert tag == 'v' + Path('VERSION').read_text().strip(), 'Tag must match VERSION'
          PY
  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import Developer ID and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD SIGNING_IDENTITY; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing release secret: $name"; exit 1; fi
          done
          umask 077
          KEYCHAIN="$RUNNER_TEMP/umamibar-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/umamibar-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "umamibar-signing.p12").write_bytes(base64.b64decode(os.environ["CERTIFICATE_BASE64"], validate=True))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$CERTIFICATE"
          SIGNING_KEYCHAIN="$KEYCHAIN" python3 scripts/select-signing-identity.py
          xcrun notarytool store-credentials umamibar-release --keychain "$KEYCHAIN" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Build, sign, notarize, and package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PROFILE: umamibar-release
          NOTARIZE: '1'
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ./scripts/build-app.sh
          codesign -dv --verbose=4 dist/UmamiBar.app 2>&1 | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/python" -m pip install -r scripts/requirements-dmg.txt
          DMG_PYTHON="$RUNNER_TEMP/dmg-tools/bin/python" ./scripts/package-release.sh
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/umamibar-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/umamibar-signing.p12"
      - name: Verify archive and render Cask
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 -c SHA256SUMS)
          python3 scripts/generate-cask.py --repository "$REPOSITORY" --version "$(cat VERSION)" --archive "dist/UmamiBar-$(cat VERSION)-universal.zip" --notarized
          ruby -c dist/umamibar.rb
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "dist/UmamiBar-$(cat VERSION)-universal.dmg" "dist/UmamiBar-$(cat VERSION)-universal.zip" dist/SHA256SUMS dist/umamibar.rb dist/appcast.xml --verify-tag --title "UmamiBar $TAG" --generate-notes
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Propose Homebrew update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p Casks
          gh release download "$TAG" --pattern umamibar.rb --dir /tmp/umamibar-cask
          cp /tmp/umamibar-cask/umamibar.rb Casks/umamibar.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="automation/homebrew-$TAG"
          git checkout -B "$BRANCH"
          git add Casks/umamibar.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(homebrew): update UmamiBar to $TAG"
          # Re-runs regenerate the same automation branch instead of failing on push.
          git push --force origin "$BRANCH"
          printf 'Updates the Homebrew Cask to the published release and its exact SHA-256. Merge to make the version available through the tap.\n' > /tmp/cask-pr.md
          if ! gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -qx OPEN; then
            gh pr create --title "chore(homebrew): update to $TAG" --body-file /tmp/cask-pr.md --head "$BRANCH"
          fi
          # Pull requests opened with GITHUB_TOKEN do not trigger workflows; dispatch CI
          # explicitly so the PR head commit gets checks.
          gh workflow run ci.yml --ref "$BRANCH"
